# Выкладывает сайт на хостинг reg.ru по FTP после каждого push в main.
# Нужны секреты репозитория FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Отдельный FTP-пользователь с домашней папкой www/watch-supreme.ru, поэтому выкладываем в его корень (./).
name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Skip until FTP access is configured
        if: env.FTP_SERVER == ''
        run: echo "FTP_SERVER is not set, nothing to deploy."

      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''

      # Новая версия в ссылках на CSS/JS, чтобы браузеры не показывали старый дизайн из кэша.
      - name: Stamp asset versions
        if: env.FTP_SERVER != ''
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" index.html
      - name: Upload over FTP
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ vars.FTP_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            apps-script/**
            README.md
            CLAUDE.md
            CNAME
